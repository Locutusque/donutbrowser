name: Build Installers

# Builds installers on demand and keeps them as run artifacts. The release
# workflows only fire on a push to main or a v* tag, and every job in them is
# gated on `github.repository == 'zhom/donutbrowser'`, so there is no way to get
# an installer out of a fork or a feature branch. This one has no such gate, on
# purpose: it is for testing a branch on real hardware before it merges.
#
# Builds are unsigned. The signing secrets live on the upstream repository, and
# a fork has none, so macOS will refuse the app until Gatekeeper is told
# otherwise. See the job summary this workflow writes for how.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows

permissions:
  contents: read

jobs:
  select:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # The matrix is filtered here rather than with a job-level `if`, because
      # the `matrix` context is not available to one: a job `if` cannot see the
      # entry it would be skipping.
      - id: pick
        shell: bash
        env:
          WANTED: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          targets='[
            {"label":"macOS (Apple Silicon)","family":"macos","platform":"macos-latest","target":"aarch64-apple-darwin"},
            {"label":"macOS (Intel)","family":"macos","platform":"macos-latest","target":"x86_64-apple-darwin"},
            {"label":"Linux (x86_64)","family":"linux","platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"label":"Linux (arm64)","family":"linux","platform":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"label":"Windows (x86_64)","family":"windows","platform":"windows-latest","target":"x86_64-pc-windows-msvc"}
          ]'
          if [ "$WANTED" = "all" ]; then
            matrix=$(jq -c '{include: .}' <<<"$targets")
          else
            matrix=$(jq -c --arg f "$WANTED" '{include: [.[] | select(.family == $f)]}' <<<"$targets")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $(jq -r '.include[].label' <<<"$matrix" | paste -sd', ' -)"

  build:
    name: ${{ matrix.label }}
    needs: select
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 #v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux only)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config unzip xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2.9.2
        with:
          workdir: ./src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # No tagName, so tauri-action builds without publishing a release. The
      # sidecar build (donut-proxy) and the Xray-core download are handled by
      # the beforeBuildCommand in tauri.conf.json.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f #v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          # Inlined at build time and not inherited from the job env, so it has
          # to be named here as well. Empty on a fork, which is fine.
          NEXT_PUBLIC_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE }}
        with:
          projectPath: ./src-tauri
          args: --target ${{ matrix.target }} --verbose

      # Each platform produces only some of these; upload-artifact fails only
      # when no pattern matches anything at all.
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: donut-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "Artifact: \`donut-${{ matrix.target }}\`"
            echo
            if [ "${{ matrix.family }}" = "macos" ]; then
              echo "Unsigned, and downloaded files are quarantined, so macOS will"
              echo "report the app as damaged until the attribute is cleared:"
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine "/Applications/Donut Browser.app"'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
